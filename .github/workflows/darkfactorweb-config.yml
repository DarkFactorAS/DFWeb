#
# Build Deploy file for Docker container
# Change the variables in this section to match your project
#

#
# Common variables and secrets
#   Environment
#     secrets.DATABASE_PASSWORD
#     vars.DATABASE_NAME
#     vars.DATABASE_PORT
#     vars.EXTERNAL_PORT
#   Repository:
#     secrets.DATABASE_USERNAME
#   Organization:
#     vars.DATABASE_SERVER
#

# Account variables and secrets (optional, only if using account server)
#   Environment
#     secrets.ACCOUNTSERVER_URL
#     secrets.ACCOUNTSERVER_CLIENTSECRET

name: DFWeb - Create Config

permissions:
  contents: read

defaults:
  run:
    working-directory: .

on:

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      config_settings:
        description: 'Optional flags: accountserver,bugreportweb'
        required: false
        default: ''
        type: string
      gen_config:
        description: 'Generate config diagnostics'
        required: false
        default: false
        type: boolean
      debug:
        description: 'Print config diagnostics'
        required: false
        default: false
        type: boolean

  push:
    environment:
      name: 'staging'

#permissions:
#  contents: read

jobs:

  deploy:
    environment:
      name: 'staging'

    permissions:
      contents: read

    # Timeout for the job
    timeout-minutes: 5

    runs-on: self-hosted

    env:
      ASPNETCORE_ENVIRONMENT: ${{ inputs.environment }}
      CONFIG_TEMPLATE: ${{ vars.CONFIG }}
      CONFIG_FILE: appsettings.${{ inputs.environment }}.json
      CONFIG_PATH: "."
      CONFIG_SETTINGS: ${{ inputs.config_settings }}
      DATABASE_SERVER: ${{ vars.DATABASE_SERVER }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      ACCOUNTSERVER_URL: ${{ secrets.ACCOUNTSERVER_URL }}
      ACCOUNTSERVER_CLIENTSECRET: ${{ secrets.ACCOUNTSERVER_CLIENTSECRET }}
      BUGREPORTSERVER_URL: ${{ vars.BUGREPORTSERVER_URL }}

    steps:

#    - name: Checkout repository
#      uses: actions/checkout@v4      

    - name: Verify Config template
      run: |
        if [ -z "${{ env.CONFIG_TEMPLATE }}" ]; then
          echo "Config template is not set. Please check the repository and environment variables."
          exit 1
        fi

    - name: Verify DB secrets
      if: ${{ !contains(inputs.config_settings, 'skipdbcheck') }}  
      run: |
        if [ -z "${{ vars.DATABASE_SERVER }}" ] || [ -z "${{ vars.DATABASE_PORT }}" ] || [ -z "${{ secrets.DATABASE_USERNAME }}" ] || [ -z "${{ secrets.DATABASE_PASSWORD }}" ]; then
          echo "Database settings are not set. Please check the secrets."
          exit 1
        fi

    # Create the config file
    - name: Create config file
      if: ${{ inputs.debug }}
      run: |
        printf '%s\n' "$CONFIG_TEMPLATE" > "${{ env.CONFIG_PATH }}/${{ env.CONFIG_FILE }}"

    - name: Generate config file from template
      if: ${{ inputs.gen_config == 'true' }}
      env:
        CONFIG_TEMPLATE: ${{ vars.CONFIG }}
        CONFIG_SETTINGS: ${{ inputs.config_settings }}
        DATABASE_SERVER: ${{ vars.DATABASE_SERVER }}
        DATABASE_PORT: ${{ vars.DATABASE_PORT }}
        DATABASE_NAME: ${{ vars.DATABASE_NAME }}
        DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
        DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ACCOUNTSERVER_URL: ${{ secrets.ACCOUNTSERVER_URL }}
        ACCOUNTSERVER_CLIENTSECRET: ${{ secrets.ACCOUNTSERVER_CLIENTSECRET }}
        BUGREPORTSERVER_URL: ${{ vars.BUGREPORTSERVER_URL }}
      run: |
        python3 - <<'PY'
        import ipaddress
        import json
        import os
        import pathlib
        import re
        import sys

        template = os.environ.get("CONFIG_TEMPLATE", "")
        if not template.strip():
            print("CONFIG template is empty. Set repository/environment variable 'CONFIG'.", file=sys.stderr)

        db_server = os.environ.get("DATABASE_SERVER", "").strip()
        try:
            ipaddress.ip_address(db_server)
        except ValueError:
          print(f"Warning: DATABASE_SERVER is missing or not an IP address: {db_server!r}", file=sys.stderr)

        config_settings = os.environ.get("CONFIG_SETTINGS", "")
        result = template

        replacements = {
            "DATABASE.SERVER": os.environ.get("DATABASE_SERVER", ""),
            "DATABASE.PORT": os.environ.get("DATABASE_PORT", ""),
            "DATABASE.USERNAME": os.environ.get("DATABASE_USERNAME", ""),
            "DATABASE.PASSWORD": os.environ.get("DATABASE_PASSWORD", ""),
            "DATABASE.NAME": os.environ.get("DATABASE_NAME", ""),
        }

        if "accountserver" in config_settings:
            replacements["ACCOUNTSERVER.URL"] = os.environ.get("ACCOUNTSERVER_URL", "")
            replacements["ACCOUNTSERVER.CLIENTSECRET"] = os.environ.get("ACCOUNTSERVER_CLIENTSECRET", "")

        if "bugreportweb" in config_settings:
            replacements["BUGREPORTSERVER.URL"] = os.environ.get("BUGREPORTSERVER_URL", "")

        for token, value in replacements.items():
            if value:
                result = result.replace(token, value)

        unresolved_required = [
            "DATABASE.SERVER",
            "DATABASE.PORT",
            "DATABASE.USERNAME",
            "DATABASE.PASSWORD",
            "DATABASE.NAME",
        ]
        missing = [token for token in unresolved_required if token in result]
        if missing:
          print(f"Warning: unresolved placeholders in CONFIG: {', '.join(missing)}", file=sys.stderr)

        # Validate that generated output is valid JSON.
        try:
            json.loads(result)
        except json.JSONDecodeError as exc:
          print(f"Warning: generated CONFIG is not valid JSON: {exc}", file=sys.stderr)

        output_path = pathlib.Path(os.environ["CONFIG_PATH"]) / os.environ["CONFIG_FILE"]
        output_path.write_text(result + "\n", encoding="utf-8")

        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
            env_file.write("CONFIG<<EOF\n")
            env_file.write(result)
            env_file.write("\nEOF\n")

        print(f"Wrote config file: {output_path}")
        PY

    - name: Debug generated config
      if: ${{ inputs.debug }}
      run: |
        python3 - <<'PY'
        import ipaddress
        import json
        import os
        import pathlib
        import re
        import sys

        output_path = pathlib.Path(os.environ["CONFIG_PATH"]) / os.environ["CONFIG_FILE"]
        text = output_path.read_text(encoding="utf-8")
        data = json.loads(text)
        db_server = data.get("DatabaseConnection", {}).get("Server", "")
        try:
            ipaddress.ip_address(db_server)
            ip_ok = True
        except ValueError:
            ip_ok = False

        # Redact sensitive fields before printing preview.
        preview = re.sub(r'("Password"\s*:\s*")[^"]*(")', r'\1***\2', text)
        preview = re.sub(r'("ClientSecret"\s*:\s*")[^"]*(")', r'\1***\2', preview)

        print(f"Generated file: {output_path}")
        print(f"DatabaseConnection.Server: {db_server}")
        print(f"DatabaseConnection.Server is IP: {ip_ok}")
        print("Preview (redacted):")
        print(preview)

        if not ip_ok:
            print("DatabaseConnection.Server is not an IP address.", file=sys.stderr)
            sys.exit(1)
        PY
