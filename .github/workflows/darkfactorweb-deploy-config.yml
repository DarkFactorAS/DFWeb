#
# Deploy the DarkFactor Web configuration.
#

name: DarkFactor Web - Deploy Config

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

  push:
    paths:
      - .github/workflows/darkfactorweb-deploy-config.yml

jobs:
  deploy:
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-deploy-config.yml@v1.8
    with:
      environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
      config_path: "~/dfweb-config"
      config_settings: "accountserver,bugreportweb"
      config_template_path: "DFWeb.FR.BootStrap/Config"
    secrets: inherit
