name: DarkFactor Web - CI Docker Container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-docker-ci.yml@v1.8
    with:
      project_name: "DFWeb.FR.BootStrap"
      dockerfile: "DFWeb.FR.BootStrap/Dockerfile"
    secrets: inherit

